# MethArCT Default Configuration
# This file is bundled with the package and loaded as the fallback default.

tools:
  diamond:
    path: "diamond"
    wsl_path: "wsl diamond"
    use_wsl: false
    threads: 4
    evalue: 1.0e-5
    max_target_seqs: 1
    identity_threshold: 30.0
  checkm2:
    path: "checkm2"
    wsl_path: "wsl checkm2"
    use_wsl: false
    threads: 4
  susha:
    enabled: true
  huainanzi:
    enabled: true
  ph:
    enabled: true
  antibiotic:
    enabled: true

databases:
  base_dir: "data/databases"
  methane_pathways:
    CO2-CH4: "methane/processed_CO2-CH4.fasta"
    Methylamine: "methane/Methylamine.fasta"
    Methanol: "methane/Methanol.fasta"
    Methanethiol: "methane/Methanethiol.fasta"
    Acetate: "methane/Acetate.fasta"
    Alkane: "methane/Alkane.fasta"
    CO-CH4: "methane/processed_CO-CH4.fasta"
    Formate: "methane/Formate.fasta"
    Methoxy: "methane/Methoxy.fasta"
    Fatty_acid: "methane/Fatty_acid.fasta"
    Dimethylamine: "methane/Dimethylamine.fasta"
    Trimethylamine: "methane/Trimethylamine.fasta"
    Glycine betaine methanogenesis: "methane/processed_Glycine_betaine_methanogenesis.fasta"
    Methylthiopropionate methanogenesis: "methane/processed_Methylthiopropionate_methanogenesis.fasta"
    Tetramethylammonium methanogenesis: "methane/Tetramethylammonium_methanogenesis.fasta"
    Methanol dismutation methanogenesis: "methane/processed_Methanol_dismutation_methanogenesis.fasta"
  sulfur_pathways:
    ASR: "sulfur/Assimilatory sulfate reduction.fasta"
    SO: "sulfur/Sulfide oxidation.fasta"
    SOX: "sulfur/Sulfur oxidation, SOX system.fasta"
    S4I: "sulfur/Sulfur oxidation, tetrathionate intermediate (S4I) pathway.fasta"
    SR: "sulfur/Sulfur reduction.fasta"
    DSR: "sulfur/Dissimilatory sulfate reduction.fasta"
  nitrogen_pathways:
    ANR: "nitrogen/Assimilatory nitrate reduction.fasta"
    DEN: "nitrogen/Denitrification.fasta"
    DNR: "nitrogen/Dissimilatory nitrate reduction.fasta"
    NIT: "nitrogen/Nitrification.fasta"
    AMX: "nitrogen/Anammox.fasta"
    CNIT: "nitrogen/Complete nitrification.fasta"
    NFX1: "nitrogen/Nitrogen fixation1.fasta"
    NFX2: "nitrogen/Nitrogen fixation2.fasta"
  cultivation_pathways:
    amino_acid: "cultivation/path.aa"
    vitamin: "cultivation/path.vc"
    nucleotide: "cultivation/path_hesuan"
    atp: "cultivation/path_atp"
  kangshengsu: "kangshengsu"

