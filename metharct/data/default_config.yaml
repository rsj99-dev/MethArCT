cultivation:
  diamond_path: "diamond"
  use_wsl: false
  threads: 4
  evalue: 1.0e-5
  identity_threshold: 30.0
  pathway_weights:
    amino_acid: 0.4
    vitamin: 0.3
    nucleotide: 0.2
    atp: 0.1
  cultivability_thresholds:
    high: 0.8
    medium: 0.6
    low: 0.4

output:
  base_dir: "results"
  formats:
    - csv
    - json
    - html

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "metharct.log"
