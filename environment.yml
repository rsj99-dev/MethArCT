name: metharct
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.9
  - pip

  # Bioinformatics tools
  - diamond>=2.0.0
  - checkm2

  # Scientific computing
  - numpy>=1.21.0
  - pandas>=1.3.0
  - scipy>=1.7.0
  - scikit-learn>=1.0.0

  # Bioinformatics libraries
  - biopython>=1.79

  # System utilities
  - wget
  - curl

  # pip dependencies
  - pip:
    - tqdm>=4.60.0
    - pyyaml>=5.4
    - loguru>=0.5.0
    - requests>=2.25.0
    - joblib>=1.0.0
    - hmmlearn>=0.3.0
    - shap>=0.40.0
    - openpyxl>=3.0.0
