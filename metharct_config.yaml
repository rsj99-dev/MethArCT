    甘氨酸甜菜碱产甲烷: 3     # 甘氨酸甜菜碱产甲烷途径：MtgB、dimethylamine corrinoid protein 3、MV10360
    硫代丙酸甲酯产甲烷: 4
    四甲基铵产甲烷: 3     # 四甲基铵产甲烷途径：MtqA/MT2、MtqB、MtqC
