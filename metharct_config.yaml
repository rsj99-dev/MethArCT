# MethArCT 配置文件 (LoongArch64)
# 使用方法: metharct analyze <input> --config metharct_config.yaml

tools:
  diamond:
    # 龙芯编译的 DIAMOND 路径，按实际安装位置修改
    path: "./loongarch_install/bin/diamond"
    use_wsl: false
    threads: 4
    evalue: 1e-5
    max_target_seqs: 1
    identity_threshold: 30.0

  tome:
    # Tome 为纯 Python，直接使用 python_module 模式
    path: "python_module"
    use_wsl: false
    threads: 4

  checkm2:
    # CheckM2 需要从 conda 安装（龙芯支持情况视具体环境）
    path: "checkm2"
    use_wsl: false
    threads: 4

databases:
  base_dir: "data/databases"
  pathway_names:
    "CO2-CH4": "CO2 reduction methanogenesis"
    "JIAAN-CH4": "Methylamine methanogenesis"
    "JIACHUN-CH4": "Methanol methanogenesis"
    "JIALIUCHUN-CH4": "Methanethiol methanogenesis"
    "JIASUAN-CH4": "Formate methanogenesis"
    "JIAYANGJI-CH4": "Methoxy methanogenesis"
    "YISUAN-CH4": "Acetate methanogenesis"
    "C16-CH4": "Long-chain fatty acid methanogenesis"
    "CO-CH4": "CO methanogenesis"
    "甘氨酸甜菜碱产甲烷": "Glycine betaine methanogenesis"
    "硫代丙酸甲酯产甲烷": "Methylthiopropionate methanogenesis"
    "四甲基铵产甲烷": "Tetramethylammonium methanogenesis"
    "甲醇歧化产甲烷": "Methanol dismutation methanogenesis"

reference_sequence_counts:
    JIASUAN-CH4: 18
    CO2-CH4: 15
    甘氨酸甜菜碱产甲烷: 3
    硫代丙酸甲酯产甲烷: 4
    四甲基铵产甲烷: 3
    甲醇歧化产甲烷: 15
